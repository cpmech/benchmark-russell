[package]
name = "benchmark-russell"
version = "2.0.0"
edition = "2024"

[dependencies]
fancy-regex = "0.18"
russell_lab = { version = "5.0", features = ["intel_mkl"] }
russell_sparse = { version = "5.0", features = [
  "intel_mkl",
  "mumps",
  "umfpack",
] }
russell_stat = "5.0"
plotpy = "1.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
